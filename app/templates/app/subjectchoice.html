{% extends "app/teacher_dashboard.html" %}

{% block content %}

<h3>{{ message }}</h3>

<div class="row">
    <div class="col-md-8">
        <section id="loginForm">
            <form action="" method="post" class="form-horizontal">
                {% csrf_token %}
                <hr />
                <div class="form-group">
                    {{ b_form }}
                </div>
                <div class="form-group">
                    <div class="col-md-offset-2 col-md-10">
                        <input type="hidden" name="next" value="/" />
                        <button type="submit" name="action" value="chon" class="btn btn-default">Chọn</button>
                        <button type="submit" name="action" value="delete" class="btn btn-default">Xóa</button>
                        <button type="submit" name="action" value="cancel" class="btn btn-default">Thoát</button>
                    </div>
                </div>
                {% if form.errors %}
                <p class="validation-summary-errors">Please enter a correct user name and password.</p>
                {% endif %}
            </form>
        </section>
    </div>
    <div class="col-md-4">
        <section id="socialLoginForm"></section>
    </div>
</div>

<p>Use this area to provide additional information.</p>

{% endblock %}
