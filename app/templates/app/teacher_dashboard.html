<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'app/content/bootstrap.min.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'app/content/site.css' %}" />
    <script src="{% static 'app/scripts/modernizr-2.6.2.js' %}"></script>
</head>

<body>
    <div class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav">
                    <li><a href="{% url 'unitsstart' %}">Năm học</a></li>
                    <li><a href="{% url 'unitspartviews' %}">Môn học</a></li>
                    <li><a href="{% url 'apmajorviews' %}">Ngành học</a></li>
                    <li><a href="{% url 'teacher_lophp' %}">Lớp học phần</a></li>
                    <li><a href="{% url 'teacher_lichthi' %}">Lịch thi</a></li>
                    <li><a href="{% url 'mkquestions' %}">Tạo đề thi</a></li>
                    <li><a href="{% url 'tea_nghg' %}">Chỉnh sửa đề thi</a></li>
                    <li><a href="{% url 'settest' %}">Thiết lập thi</a></li>
                    <li><a href="{% url 'tea_kqt' %}">Xuất kết quả thi</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container body-content">
        {% block content %}{% endblock %}
        <hr />
        <footer>
            <p>&copy; {{ year }} - AlpineTest</p>
        </footer>
    </div>

    <script src="{% static 'app/scripts/jquery-1.10.2.js' %}"></script>
    <script src="{% static 'app/scripts/bootstrap.js' %}"></script>
    <script src="{% static 'app/scripts/respond.js' %}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
